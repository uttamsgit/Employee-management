services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-employee_center}
      POSTGRES_USER: ${POSTGRES_USER:-employee_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_db_password}
    volumes:
      - employee_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-employee_admin} -d ${POSTGRES_DB:-employee_center}"]
      interval: 5s
      timeout: 5s
      retries: 15

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-employee_admin}:${POSTGRES_PASSWORD:-change_this_db_password}@db:5432/${POSTGRES_DB:-employee_center}?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_to_a_long_random_secret}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@employeecenter.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "5173:80"

volumes:
  employee_data:
